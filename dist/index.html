<style>
/* Layout: one-column phone app shell: top bar, scrolling content, bottom tab bar; content capped at 560px on wide screens */
:root{
  --bg:#F3F1EA; --surface:#FFFFFF; --ink:#1D2926; --muted:#56625E; --line:#E1DDD2;
  --brand:#0F5E52; --on-brand:#FFFFFF; --brand-soft:#DCEDE8;
  --amber:#E39B2E; --amber-soft:#FBEBD2; --amber-ink:#87500A;
  --bad:#B3372A; --bad-soft:#F8E0DC;
  --f-ui:"Noto Sans Thai","Noto Sans Lao","Noto Sans SC",system-ui,sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-zhd:"Noto Serif SC","Songti SC","Noto Sans SC",serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1A2421; --ink:#E7EEEB; --muted:#9BAAA5; --line:#2B3833;
  --brand:#45B8A2; --on-brand:#0A1512; --brand-soft:#183A33;
  --amber:#E8AA48; --amber-soft:#3A2D17; --amber-ink:#F2C47C;
  --bad:#E3806F; --bad-soft:#3B201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1A2421; --ink:#E7EEEB; --muted:#9BAAA5; --line:#2B3833;
  --brand:#45B8A2; --on-brand:#0A1512; --brand-soft:#183A33;
  --amber:#E8AA48; --amber-soft:#3A2D17; --amber-ink:#F2C47C;
  --bad:#E3806F; --bad-soft:#3B201C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
.wrap{max-width:560px;margin:0 auto;width:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;min-height:48px}
.brandname{font-weight:700;font-size:19px;flex:1;display:flex;align-items:center;gap:8px}
.brandname .seal{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--f-zhd);font-size:17px}
.toptitle{flex:1;font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .wrap{padding-block:16px 28px;display:flex;flex-direction:column;gap:14px}
.tabs{background:var(--surface);border-top:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-block:4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:10px}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;min-height:34px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero h1{margin:0;font-size:22px;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:color-mix(in srgb,var(--on-brand) 14%,transparent);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.stat b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;opacity:.9}
.bar{height:8px;background:color-mix(in srgb,currentColor 18%,transparent);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:999px;transition:width .3s}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec h2{margin:0;font-size:18px}
.sec span{font-size:13px;color:var(--muted)}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.lesson.next{border:2px solid var(--amber);padding:11px 13px}
.glyph{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-zhd);font-size:21px;flex-shrink:0}
.lesson.next .glyph{background:var(--amber-soft);color:var(--amber-ink)}
.lesson .txt{flex:1;min-width:0}
.lesson .n{font-size:12px;color:var(--muted);letter-spacing:.02em}
.lesson .ti{font-weight:600;line-height:1.35}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px;cursor:pointer;width:100%;box-sizing:border-box}
.btn.ghost{background:var(--surface);color:var(--brand);border:2px solid var(--brand)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.steps button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.steps button[aria-current="step"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.steps button.past{color:var(--brand);border-color:var(--brand)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.flash .zh{font-family:var(--f-zhd);font-size:clamp(56px,18vw,84px);line-height:1.15;color:var(--brand)}
.py{color:var(--amber-ink);font-weight:600}
.flash .py{font-size:22px}
.spk{width:60px;height:60px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;cursor:pointer;margin-top:6px}
.spk .ic{width:28px;height:28px}
.spk.sm{width:44px;height:44px;background:var(--brand-soft);color:var(--brand);margin:0}
.spk.sm .ic{width:20px;height:20px}
.means{width:100%;border-top:1px solid var(--line);margin-top:12px;padding-top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mrow{display:flex;gap:10px;align-items:center;text-align:left}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);flex-shrink:0}
.tag.lo{background:var(--amber-soft);color:var(--amber-ink)}
.mrow .big{font-size:19px;font-weight:600}
.count{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;min-height:36px;font-family:var(--f-zh);font-size:16px;cursor:pointer}
.chip[aria-current="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.gram h3{margin:0 0 6px;font-size:17px;line-height:1.4}
.gram p{margin:0 0 10px;color:var(--ink)}
.ex{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex .t{flex:1;min-width:0}
.ex .z{font-family:var(--f-zh);font-size:20px;font-weight:500}
.ex .p{font-size:14px}
.ex .m{font-size:15px;color:var(--muted)}
.dlg{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;text-align:left;border:0;border-radius:18px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line)}
.bub.b{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.bub .who{font-size:12px;color:var(--muted);font-weight:700}
.bub .z{font-family:var(--f-zh);font-size:19px;font-weight:500}
.bub .p{font-size:14px;color:var(--amber-ink)}
.bub .m{font-size:14px;color:var(--muted)}
.sayc{display:flex;flex-direction:column;gap:8px}
.sayc .z{font-family:var(--f-zh);font-size:24px;font-weight:500}
.micbtn{border:0;background:var(--brand);color:var(--on-brand);border-radius:12px;min-height:48px;padding:0 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:inherit;font-size:16px}
.micbtn.on{background:var(--bad);animation:micp 1.2s ease-in-out infinite}
@keyframes micp{50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){.micbtn.on{animation:none}}
.micres{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--brand-soft)}
.micres.mid{background:var(--amber-soft)}.micres.low,.micres.err{background:var(--bad-soft)}
.micres .cmp{font-family:var(--f-zh);font-size:22px;letter-spacing:.04em}
.micres .cmp .ok{color:var(--brand)}.micres .cmp .miss{color:var(--bad);text-decoration:underline}
.micres .pct{font-weight:800;font-size:18px}
.micres small{color:var(--muted)}
.saidbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.saidbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.qprog{display:flex;align-items:center;gap:10px}
.qprog .bar{flex:1;color:var(--muted)}
.qprog span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qlabel{font-size:15px;color:var(--muted);font-weight:600}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qcard .zh{font-family:var(--f-zhd);font-size:56px;line-height:1.2;color:var(--brand)}
.qcard .mean{font-size:26px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:8px 16px;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt.zhf{font-family:var(--f-zh);font-size:22px;font-weight:500}
.opt.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.ansline{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:0 14px;font-family:var(--f-zh);font-size:20px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.ansline .tok{background:var(--brand-soft);border-color:transparent;box-shadow:none}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--brand-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{font-size:17px}
.fb.good b{color:var(--brand)}
.fb.bad b{color:var(--bad)}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px 16px}
.result .score{font-size:56px;font-weight:700;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.topic .zh{font-family:var(--f-zhd);font-size:26px;color:var(--brand)}
.topic .nm{font-weight:600}
.topic small{color:var(--muted);font-size:12px}
.wl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}
.wl .z{font-family:var(--f-zh);font-size:24px;min-width:64px}
.wl .t{flex:1;min-width:0}
details.gp{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.gp summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.gp summary::-webkit-details-marker{display:none}
details.gp summary::after{content:"+";font-size:20px;color:var(--brand)}
details.gp[open] summary::after{content:"–"}
details.gp .in{padding:0 14px 8px}
.glh{font-size:13px;color:var(--muted);font-weight:700;margin:8px 2px 0;letter-spacing:.02em}
.steplist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.note{font-size:14px;color:var(--muted)}
.lesson.locked .glyph,.topic.locked .zh{opacity:.55}
.lesson.locked .ti,.topic.locked .nm{color:var(--muted)}
.pill.lockp{display:inline-flex;align-items:center;gap:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.lockp .ic{width:14px;height:14px}
.gplock{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left;padding:12px 14px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:12px 14px;font-weight:600;border:0;text-align:left;width:100%;box-sizing:border-box}
.banner.warn{background:var(--amber-soft);color:var(--amber-ink)}
.banner.bad{background:var(--bad-soft);color:var(--bad);cursor:pointer}
.mstatus{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--bg)}
.mstatus.ok{background:var(--brand-soft);color:var(--brand)}
.mstatus.bad{background:var(--bad-soft);color:var(--bad)}
.devbox{display:flex;justify-content:space-between;align-items:center;gap:12px;border:2px dashed var(--line);border-radius:14px;padding:12px 14px}
.devid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:.08em;user-select:all}
.codein{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;text-transform:uppercase;width:100%;box-sizing:border-box}
.codein:focus{border-color:var(--brand);outline:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted)}
.lvl{font-size:13px;font-weight:700;color:var(--amber-ink);background:var(--amber-soft);border-radius:999px;padding:2px 10px}
button.banner{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(90vw,420px);z-index:20}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

</style>

<header class="top"><div class="wrap" id="top"></div></header>

 d:[["A","我想在中国开公司，需要什么证明？","Wǒ xiǎng zài Zhōngguó kāi gōngsī, xūyào shénme zhèngmíng?","ฉันอยากเปิดบริษัทที่จีน ต้องใช้เอกสารรับรองอะไรบ้าง"],["律师","按照中国的法律规定，你需要很多正式的材料。","Ànzhào Zhōngguó de fǎlǜ guīdìng, nǐ xūyào hěn duō zhèngshì de cáiliào.","ตามกฎหมายจีน คุณต้องใช้เอกสารทางการหลายอย่าง"],["A","要求严格吗？","Yāoqiú yángé ma?","ข้อกำหนดเข้มงวดไหม"],["律师","很严格。所有材料都必须符合标准，不合格就不允许开公司。","Hěn yángé. Suǒyǒu cáiliào dōu bìxū fúhé biāozhǔn, bù hégé jiù bù yǔnxǔ kāi gōngsī.","เข้มงวดมาก เอกสารทุกอย่างต้องได้มาตรฐาน ถ้าไม่ผ่านเกณฑ์ก็ไม่อนุญาตให้เปิดบริษัท"],["A","明白了。这是我的责任，我会认真准备。","Míngbai le. Zhè shì wǒ de zérèn, wǒ huì rènzhēn zhǔnbèi.","เข้าใจแล้ว นี่คือความรับผิดชอบของฉัน ฉันจะเตรียมให้ดี"]],

 d:[["A","你怎么教育孩子？","Nǐ zěnme jiàoyù háizi?","คุณสอนลูกยังไง"],["B","我常常鼓励他，很少批评他。他做得好，我就表扬他。","Wǒ chángcháng gǔlì tā, hěn shǎo pīpíng tā. Tā zuò de hǎo, wǒ jiù biǎoyáng tā.","ฉันให้กำลังใจเขาบ่อยๆ ไม่ค่อยตำหนิ ถ้าเขาทำได้ดีก็ชมเขา"],["A","我父亲以前对我很严格。","Wǒ fùqīn yǐqián duì wǒ hěn yángé.","เมื่อก่อนพ่อของฉันเข้มงวดกับฉันมาก"],["B","不同年龄的儿童需要不同的方法。","Bù tóng niánlíng de értóng xūyào bù tóng de fāngfǎ.","เด็กแต่ละช่วงอายุต้องใช้วิธีที่ต่างกัน"],["A","对。我奶奶也说，鼓励比批评更有用。","Duì. Wǒ nǎinai yě shuō, gǔlì bǐ pīpíng gèng yǒuyòng.","ใช่ ย่าฉันก็บอกว่า ให้กำลังใจได้ผลกว่าตำหนิ"]],

 d:[["A","你的汉语说得真好，我以为你是中国人！","Nǐ de Hànyǔ shuō de zhēn hǎo, wǒ yǐwéi nǐ shì Zhōngguó rén!","คุณพูดภาษาจีนเก่งมาก ฉันนึกว่าคุณเป็นคนจีน"],["B","哈哈，我是老挝人。本来我觉得汉语很难。","Hāha, wǒ shì Lǎowō rén. Běnlái wǒ juéde Hànyǔ hěn nán.","ฮ่าๆ ฉันเป็นคนลาว เดิมทีฉันคิดว่าภาษาจีนยากมาก"],["A","实际上呢？","Shíjì shang ne?","แล้วความจริงล่ะ"],["B","确实很难。尽管很难，我却越学越有意思，甚至每天学三个小时。","Quèshí hěn nán. Jǐnguǎn hěn nán, wǒ què yuè xué yuè yǒu yìsi, shènzhì měi tiān xué sān ge xiǎoshí.","ยากจริงๆ ถึงจะยาก แต่ยิ่งเรียนยิ่งสนุก ถึงขั้นเรียนวันละสามชั่วโมง"],["A","原来是这样！即使我很忙，也要向你学习。","Yuánlái shì zhèyàng! Jíshǐ wǒ hěn máng, yě yào xiàng nǐ xuéxí.","ที่แท้เป็นแบบนี้นี่เอง ถึงฉันจะยุ่ง ก็จะเอาอย่างคุณ"]],

 d:[["A","现在的科学技术发展得真快！","Xiànzài de kēxué jìshù fāzhǎn de zhēn kuài!","เทคโนโลยีตอนนี้พัฒนาเร็วจริงๆ"],["B","是啊，手机改变了我们的生活。我用手机学汉语。","Shì a, shǒujī gǎibiàn le wǒmen de shēnghuó. Wǒ yòng shǒujī xué Hànyǔ.","ใช่ มือถือเปลี่ยนชีวิตเรา ฉันใช้มือถือเรียนภาษาจีน"],["A","效果怎么样？","Xiàoguǒ zěnmeyàng?","ได้ผลไหม"],["B","很好。它提供很详细的语法解释，发音也很准确。","Hěn hǎo. Tā tígōng hěn xiángxì de yǔfǎ jiěshì, fāyīn yě hěn zhǔnquè.","ดีมาก มีคำอธิบายไวยากรณ์ละเอียด การออกเสียงก็แม่นยำ"],["A","我也想试试。怎么使用？","Wǒ yě xiǎng shìshi. Zěnme shǐyòng?","ฉันก็อยากลองบ้าง ใช้ยังไง"],["B","很简单，我教你！","Hěn jiǎndān, wǒ jiāo nǐ!","ง่ายมาก ฉันสอนให้"]],

 d:[["A","你去过琅勃拉邦吗？","Nǐ qùguo Lángbólābāng ma?","คุณเคยไปหลวงพระบางไหม"],["B","去过。那儿不仅风景美丽，而且非常安静。","Qùguo. Nàr bùjǐn fēngjǐng měilì, érqiě fēicháng ānjìng.","เคยไป ที่นั่นไม่เพียงแต่วิวสวย แต่ยังเงียบสงบมาก"],["A","听说那是一个很著名的城市，吸引了很多外国人。","Tīngshuō nà shì yí ge hěn zhùmíng de chéngshì, xīyǐn le hěn duō wàiguó rén.","ได้ยินว่าเป็นเมืองที่มีชื่อเสียงมาก ดึงดูดชาวต่างชาติเยอะ"],["B","对，它给我留下了很深的印象，并且那儿的人都很友好。","Duì, tā gěi wǒ liú xià le hěn shēn de yìnxiàng, bìngqiě nàr de rén dōu hěn yǒuhǎo.","ใช่ ฉันประทับใจมาก และคนที่นั่นก็เป็นมิตรมาก"],["A","作为老挝人，我很骄傲。你一定要再去一次，很值得！","Zuòwéi Lǎowō rén, wǒ hěn jiāo'ào. Nǐ yídìng yào zài qù yí cì, hěn zhídé!","ในฐานะคนลาว ฉันภูมิใจมาก คุณต้องไปอีกครั้งนะ คุ้มค่ามาก"]],

 d:[["A","最近空气质量很差，污染越来越严重了。","Zuìjìn kōngqì zhìliàng hěn chà, wūrǎn yuè lái yuè yánzhòng le.","ช่วงนี้คุณภาพอากาศแย่มาก มลพิษร้ายแรงขึ้นเรื่อยๆ"],["B","是啊。由于路上的车太多，因此空气越来越不好。","Shì a. Yóuyú lù shang de chē tài duō, yīncǐ kōngqì yuè lái yuè bù hǎo.","ใช่ เนื่องจากรถบนถนนเยอะเกินไป อากาศจึงแย่ลงเรื่อยๆ"],["A","还有人到处扔塑料袋，不扔进垃圾桶。","Hái yǒu rén dàochù rēng sùliàodài, bù rēng jìn lājītǒng.","ยังมีคนทิ้งถุงพลาสติกไปทั่ว ไม่ทิ้งลงถังขยะ"],["B","在这个方面，任何人都应该负责任。","Zài zhège fāngmiàn, rènhé rén dōu yīnggāi fù zérèn.","ในด้านนี้ ทุกคนควรรับผิดชอบ"],["A","对，我们先从自己做起吧。","Duì, wǒmen xiān cóng zìjǐ zuò qǐ ba.","ใช่ เราเริ่มจากตัวเองก่อนเถอะ"]],

 d:[["A","昨天真倒霉！我把钥匙丢了。","Zuótiān zhēn dǎoméi! Wǒ bǎ yàoshi diū le.","เมื่อวานโชคร้ายจริงๆ ฉันทำกุญแจหาย"],["B","那你怎么进家门的？","Nà nǐ zěnme jìn jiā mén de?","แล้วคุณเข้าบ้านยังไง"],["A","我敲了半天门，家里没人，于是我只好给房东打电话。","Wǒ qiāo le bàntiān mén, jiā li méi rén, yúshì wǒ zhǐhǎo gěi fángdōng dǎ diànhuà.","ฉันเคาะประตูอยู่นาน ในบ้านไม่มีคน เลยต้องโทรหาเจ้าของบ้าน"],["B","还好你很幸运，房东住得近。","Hái hǎo nǐ hěn xìngyùn, fángdōng zhù de jìn.","ยังดีที่คุณโชคดี เจ้าของบ้านอยู่ใกล้"],["A","是啊。以后我要多准备一把钥匙，否则恐怕还会后悔。","Shì a. Yǐhòu wǒ yào duō zhǔnbèi yì bǎ yàoshi, fǒuzé kǒngpà hái huì hòuhuǐ.","ใช่ ต่อไปฉันจะเตรียมกุญแจสำรองไว้ ไม่อย่างนั้นเกรงว่าจะเสียใจอีก"]],

 d:[["经理","你好，请坐。我看了你的简历，请详细地介绍一下你自己。","Nǐ hǎo, qǐng zuò. Wǒ kàn le nǐ de jiǎnlì, qǐng xiángxì de jièshào yíxià nǐ zìjǐ.","สวัสดี เชิญนั่ง ผมดูเรซูเม่คุณแล้ว ช่วยแนะนำตัวอย่างละเอียดหน่อย"],["A","我叫宋美，大学学的是汉语专业，做过两年翻译。","Wǒ jiào Sòng Měi, dàxué xué de shì Hànyǔ zhuānyè, zuò guo liǎng nián fānyì.","ฉันชื่อซ่งเหม่ย มหาวิทยาลัยเรียนสาขาภาษาจีน เคยเป็นล่ามสองปี"],["经理","你为什么想来我们公司？","Nǐ wèi shénme xiǎng lái wǒmen gōngsī?","ทำไมคุณถึงอยากมาบริษัทเรา"],["A","我对这个职业很感兴趣，而且我能很快适应新环境。","Wǒ duì zhège zhíyè hěn gǎn xìngqù, érqiě wǒ néng hěn kuài shìyìng xīn huánjìng.","ฉันสนใจอาชีพนี้มาก และฉันปรับตัวกับที่ใหม่ได้เร็ว"],["经理","很好。翻译要求很准确。下周一你可以正式上班吗？","Hěn hǎo. Fānyì yāoqiú hěn zhǔnquè. Xià zhōuyī nǐ kěyǐ zhèngshì shàngbān ma?","ดีมาก งานแปลต้องแม่นยำ วันจันทร์หน้าเริ่มงานอย่างเป็นทางการได้ไหม"],["A","没问题！谢谢您给我这个机会。","Méi wèntí! Xièxie nín gěi wǒ zhège jīhuì.","ได้เลยค่ะ ขอบคุณที่ให้โอกาสนี้"]],

   {t:"养成 + …的习惯",n:"สร้างนิสัย...",e:[["要养成早睡早起的习惯。","Yào yǎngchéng zǎo shuì zǎo qǐ de xíguàn.","ต้องสร้างนิสัยนอนเร็วตื่นเช้า"]]},

 d:[["医生","你哪儿不舒服？","Nǐ nǎr bù shūfu?","คุณไม่สบายตรงไหน"],["A","我的皮肤又红又痒，昨天吃了很多海鲜。","Wǒ de pífū yòu hóng yòu yǎng, zuótiān chī le hěn duō hǎixiān.","ผิวฉันทั้งแดงทั้งคัน เมื่อวานกินอาหารทะเลเยอะ"],["医生","你可能对海鲜过敏。最近还吃什么了？","Nǐ kěnéng duì hǎixiān guòmǐn. Zuìjìn hái chī shénme le?","คุณอาจแพ้อาหารทะเล ช่วงนี้กินอะไรอีก"],["A","我在减肥，所以每天只吃很少，经常吃又咸又辣的方便面。","Wǒ zài jiǎnféi, suǒyǐ měi tiān zhǐ chī hěn shǎo, jīngcháng chī yòu xián yòu là de fāngbiànmiàn.","ฉันกำลังลดน้ำหนัก ทุกวันกินนิดเดียว มักกินบะหมี่สำเร็จรูปที่ทั้งเค็มทั้งเผ็ด"],["医生","这样没有营养！药有点儿苦，但是要按时吃。你要养成健康的饮食习惯。","Zhèyàng méiyǒu yíngyǎng! Yào yǒudiǎnr kǔ, dànshì yào ànshí chī. Nǐ yào yǎngchéng jiànkāng de yǐnshí xíguàn.","แบบนี้ไม่มีสารอาหาร ยาขมหน่อย แต่ต้องกินตามเวลา คุณต้องสร้างนิสัยการกินที่ดีต่อสุขภาพ"]],
 s:[["我|对海鲜|过敏","Wǒ duì hǎixiān guòmǐn","ฉันแพ้อาหารทะเล"],["要|养成|好的|习惯","Yào yǎngchéng hǎo de xíguàn","ต้องสร้างนิสัยที่ดี"],["我|把书|弄脏了","Wǒ bǎ shū nòng zāng le","ฉันทำหนังสือเปื้อน"]]},

const TRIAL_DAYS=7;
const SECRET="e78d30354b4a482819c5b6551fc15622";
const ALPH="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const todayDays=()=>{const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const enc32=(n,len)=>{let s=""; for(let i=0;i<len;i++){s=ALPH[n%32]+s; n=Math.floor(n/32)} return s};
const dec32=s=>{let n=0; for(const c of s){const i=ALPH.indexOf(c); if(i<0) return -1; n=n*32+i} return n};
const norm=s=>String(s||"").toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");
const normU=s=>String(s||"").trim().toLowerCase().replace(/\s+/g,"");
async function sigOf(user,expStr){const b=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SECRET+"|U|"+user+"|"+expStr))); let s=""; for(let i=0;i<8;i++) s+=ALPH[b[i]%32]; return s;}
async function readCode(code,user){const c=norm(code), u=normU(user); if(c.length!==11||!u) return null; const e=c.slice(0,3), ex=dec32(e); if(ex<0) return null; try{ return (await sigOf(u,e))===c.slice(3)? ex : null }catch(err){ return null }}
const fmtDay=d=>new Date(d*864e5).toLocaleDateString(S.lang==="lo"?"lo-LA":"th-TH",{timeZone:"UTC",day:"numeric",month:"long",year:"numeric"});
const fmtDev=d=>d.slice(0,4)+"-"+d.slice(4);
let memberExp=null;
const effToday=()=>Math.max(todayDays(),S.maxDay||0);
const isMember=()=>memberExp!==null&&memberExp>=effToday();
const trialLeftDays=()=>S.trial?S.trial+TRIAL_DAYS-effToday():0;
const inTrial=()=>trialLeftDays()>0;
const unlocked=li=>li<FREE||isMember()||inTrial();
const curLevel=()=>{const nx=nextIdx(); const x=L[nx<0?L.length-1:nx]; return x.lv||1};
/* ---------- รหัสสำรองความคืบหน้า ---------- */
const dayOf=s=>{if(!s) return 0; const [y,m,d]=s.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const strOfDay=n=>n?new Date(n*864e5).toISOString().slice(0,10):"";
function encBig(b){if(b===0n) return "0"; let s=""; while(b>0n){s=ALPH[Number(b%32n)]+s; b/=32n} return s}
function decBig(s){let b=0n; for(const c of s){const i=ALPH.indexOf(c); if(i<0) return null; b=b*32n+BigInt(i)} return b}
function chk(s){let h=7; for(const c of s) h=(h*31+c.charCodeAt(0))%1024; return ALPH[h>>5]+ALPH[h&31]}
function makeBackup(){let m=0n; Object.keys(S.done).forEach(i=>{m|=1n<<BigInt(i)}); const body=[encBig(m),encBig(BigInt(S.pts||0)),encBig(BigInt(S.streak||0)),encBig(BigInt(dayOf(S.last)))].join("-"); return "P-"+body+"-"+chk(body);}
function readBackup(code){
  const p=String(code||"").toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z-]/g,"").split("-").filter(Boolean);
  if(p.length!==6||p[0]!=="P") return null; const body=p.slice(1,5).join("-"); if(chk(body)!==p[5]) return null;
  const v=p.slice(1,5).map(decBig); if(v.some(x=>x===null)) return null;
  const done={}; for(let i=0;i<L.length;i++) if((v[0]>>BigInt(i))&1n) done[i]=true;
  return {done,pts:Number(v[1]),streak:Number(v[2]),last:strOfDay(Number(v[3]))};
}

const SR=(window.top===window)&&(window.SpeechRecognition||window.webkitSpeechRecognition)||null; // hidden inside embedded previews, where the mic is blocked
let recog=null;
const hanOnly=s=>(s.match(/\p{Script=Han}/gu)||[]);
function micScore(target,heard){const a=hanOnly(target),b=hanOnly(heard),n=a.length,m=b.length;
 const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
 const hit=ok.filter(Boolean).length;let p=n?Math.round(hit/n*100):0;if(m>n)p=Math.max(0,p-Math.round((m-n)/n*30));
 return {p,chars:a.map((c,k)=>[c,ok[k]])};}
function stopMic(){if(recog){try{recog.abort()}catch(e){}recog=null}}
function micHTML(i){const r=view.mic&&view.mic[i];if(!r||r.st==="listen")return"";
 if(r.st==="err"){const k={"not-allowed":"micDeny","service-not-allowed":"micDeny","no-speech":"micNone","network":"micNet"}[r.err]||"micErr";return `<div class="micres err" role="status">${t(k)}</div>`;}
 const cls=r.p>=80?"":r.p>=50?"mid":"low";const msg=r.p>=80?"micGood":r.p>=50?"micMid":"micLow";
 return `<div class="micres ${cls}" role="status"><div class="row" style="justify-content:space-between;align-items:center"><span class="pct">${r.p}%</span><b>${t(msg)}</b></div><div class="cmp" lang="zh">${r.chars.map(([c,ok])=>`<span class="${ok?"ok":"miss"}">${c}</span>`).join("")}</div><small>${t("heard")}: <span lang="zh">${esc(r.heard||"—")}</span> · ${t("micTip")}</small></div>`;}

let zhVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices(); zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}catch(e){}}
try{pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(text,queue){
  try{
    if(!("speechSynthesis" in window)){toast(t("noVoice"));return}
    if(!queue) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=.85; if(zhVoice) u.voice=zhVoice;
    speechSynthesis.speak(u);
    if(!zhVoice){pickVoice(); if(!zhVoice && speechSynthesis.getVoices().length) toast(t("noVoice"));}
  }catch(e){toast(t("noVoice"))}
}
let toastTimer; function toast(m){const el=document.getElementById("toast"); el.textContent=m; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,3200);}

function mkQuiz(pool,says,n){
  const words=shuffle(pool.slice()); const kinds=["mean","rev","listen"]; const qs=[];
  const orders=shuffle(says.filter(s=>s[0].split("|").length>=2).slice()).slice(0,2);
  const nChoice=Math.max(1,n-orders.length);
  for(let i=0;i<nChoice;i++){
    const w=words[i%words.length]; const k=kinds[i%3];
    let ds=shuffle(pool.filter(x=>x[0]!==w[0]&&mean(x)!==mean(w)));
    if(ds.length<3) ds=ds.concat(shuffle(ALLV.filter(x=>x[0]!==w[0]&&mean(x)!==mean(w)&&!ds.includes(x))));
    qs.push({k,w,opts:shuffle([w].concat(ds.slice(0,3))),pick:null,res:null});
  }
  shuffle(qs);
  orders.forEach(s=>{const toks=s[0].split("|"); let bank=shuffle(toks.slice()); let g=0; while(bank.join("")===toks.join("")&&g++<8) bank=shuffle(bank); qs.push({k:"order",s:toks,py:s[1],th:s[2],bank,built:[],res:null});});
  return {qs,i:0,correct:0};
}

  <button class="btn soft" data-a="copybk">${t("copyBackup")}</button>
  <label for="restoreInput" style="font-weight:600">${t("restoreLabel")}</label>
  <input id="restoreInput" class="codein" style="font-size:17px" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="P-…">
  <button class="btn ghost" data-a="restore" id="restoreBtn">${t("restoreBtn")}</button><div id="restoreMsg" class="note" role="status"></div></div>`;
}
function memberCardHTML(){
  const st=memberStatus();
  return `<div class="card" id="member" style="display:flex;flex-direction:column;gap:14px">
    ${S.user&&memberExp!==null?`<div class="devbox"><div><div class="note">${t("member")}</div><div class="devid" style="text-transform:none">${esc(S.user)}</div></div></div>`:""}
    <div class="mstatus ${st.cls}">${isMember()||inTrial()?IC.check:IC.lock}<b>${esc(st.txt)}</b></div>
    <div style="display:flex;flex-direction:column;gap:8px"><label for="userInput" style="font-weight:600">${t("userLabel")}</label>
      <input id="userInput" class="codein" style="text-transform:none" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="hsk001" maxlength="30" value="${esc(S.user)}">
      <label for="codeInput" style="font-weight:600">${t("codeLabel")}</label>
      <input id="codeInput" class="codein" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXX-XXXX-XXXX" maxlength="16">
      <button class="btn" data-a="activate">${t("activate")}</button>
      <div id="codeMsg" class="note" role="status"></div></div>
    ${joinStepsHTML()}
    <p class="note" style="margin:0">${t("keepNote")}</p>
  </div>`;
}
function lockedHTML(){
  const x=L[view.li];
  return `<div class="card result"><span class="glyph" aria-hidden="true" style="width:72px;height:72px;font-size:28px">${x.zh}</span><div style="display:flex;align-items:center;gap:8px;color:var(--amber-ink)">${IC.lock}<b style="font-size:19px">${t("lockedTitle")}</b></div><p class="note" style="margin:0">${t("lockedLead")}</p></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">${joinStepsHTML()}</div>
  <button class="btn" data-a="join">${t("goJoin")}</button>`;
}

/* ---------- หน้าบทเรียน ---------- */
function viewHTML(){
  if(view.type==="locked") return lockedHTML();
  if(view.type==="lesson") return lessonHTML();
  if(view.type==="topic") return topicHTML();
  if(view.type==="quiz") return view.quiz.fin? resultHTML(view.quiz,false) : quizHTML(view.quiz);
  return "";
}
function lessonHTML(){
  const x=L[view.li], steps=stepsOf(view.li), st=steps[view.step];
  if(view.fin) return resultHTML(view.quiz,true);
  let h=`<div class="steps" role="list">${steps.map((s,i)=>`<button role="listitem" data-a="step" data-v="${i}" ${i===view.step?'aria-current="step"':""} class="${i<view.step?"past":""}">${t(s)}</button>`).join("")}</div>`;
  const nextBtn=()=>{const ns=steps[view.step+1]; return `<button class="btn" data-a="step" data-v="${view.step+1}">${T[S.lang].nextTo(t(ns))}</button>`;};
  if(st==="vocab"){
    const w=x.v[view.vi], last=view.vi===x.v.length-1, other=S.lang==="lo"?[w[2],"ไทย",""]:[w[3],"ລາວ","lo"];
    h+=`<div class="flash"><div class="zh" lang="zh">${w[0]}</div><div class="py">${esc(w[1])}</div><button class="spk" data-a="say" data-v="${esc(w[0])}" aria-label="ฟังเสียง">${IC.spk}</button>
      <div class="means"><div class="mrow"><span class="tag ${S.lang==="lo"?"lo":""}">${S.lang==="lo"?"ລາວ":"ไทย"}</span><span class="big">${esc(mean(w))}</span></div><div class="mrow"><span class="tag ${other[2]}">${other[1]}</span><span>${esc(other[0])}</span></div></div></div>
      <div class="count">${view.vi+1} / ${x.v.length}</div>
      <div class="row"><button class="btn ghost" data-a="vprev" ${view.vi===0?"disabled":""}>${t("prev")}</button>${last?nextBtn():`<button class="btn" data-a="vnext">${t("next")}</button>`}</div>
      <div class="chips">${x.v.map((v,i)=>`<button class="chip" data-a="vjump" data-v="${i}" ${i===view.vi?'aria-current="true"':""}>${v[0]}</button>`).join("")}</div>`;
  }
  if(st==="gram"){
    x.g.forEach(g=>{h+=`<div class="card gram"><h3>${esc(tx(g.t))}</h3><p>${esc(tx(g.n))}</p>${g.e.map(exHTML).join("")}</div>`;});
    h+=nextBtn();
  }
  if(st==="dlg"){
    h+=`<button class="btn soft" data-a="sayall">${IC.spk}${t("playAll")}</button><div class="dlg">`;
    const first=x.d[0][0];
    x.d.forEach(d=>{h+=`<button class="bub ${d[0]===first?"":"b"}" data-a="say" data-v="${esc(d[1])}"><span class="who">${esc(d[0])}</span><span class="z">${d[1]}</span><span class="p">${esc(d[2])}</span><span class="m">${esc(tx(d[3]))}</span></button>`;});
    h+=`</div>`+nextBtn();
  }
  if(st==="say"){
    h+=`<p class="note" style="margin:0">${t("sayHint")}</p>`;
    x.s.forEach((s,i)=>{const z=s[0].split("|").join(""); h+=`<div class="card sayc"><div class="z">${z}</div><div class="py">${esc(s[1])}</div><div class="note">${esc(tx(s[2]))}</div><div class="row" style="align-items:center"><button class="btn soft" data-a="say" data-v="${esc(z)}" style="min-height:44px">${IC.spk}${t("listen")}</button><button class="saidbtn" data-a="said" data-v="${i}" aria-pressed="${!!view.said[i]}" style="justify-content:center">${IC.check}${t("said")}</button></div>${SR?`<button class="micbtn ${view.mic&&view.mic[i]&&view.mic[i].st==="listen"?"on":""}" data-a="mic" data-v="${i}">${IC.mic}${view.mic&&view.mic[i]&&view.mic[i].st==="listen"?t("micStop"):t("micBtn")}</button>${micHTML(i)}`:""}</div>`;});
    h+=nextBtn();
  }
  if(st==="quiz"){
    if(!view.quiz) view.quiz=mkQuiz(x.v,view.li>0?x.s:[],8);
    h+=quizHTML(view.quiz);
  }
  return h;
}
function topicHTML(){
  const x=TOPICS[view.ti], ws=topicWords(view.ti);
  let h=`<div class="card" style="display:flex;gap:14px;align-items:center"><span class="glyph" aria-hidden="true" style="width:64px;height:64px;font-size:24px">${x.zh}</span><div><div style="font-weight:700;font-size:20px">${esc(lname(x))}</div><div class="note">${t("lesson")} ${x.l} · ${ws.length} ${t("words")}</div></div></div><div class="card">`;
  ws.forEach(w=>{h+=`<div class="wl"><span class="z">${w[0]}</span><span class="t"><span class="py">${esc(w[1])}</span><br>${esc(mean(w))}</span><button class="spk sm" data-a="say" data-v="${esc(w[0])}" aria-label="ฟัง">${IC.spk}</button></div>`;});
  h+=`</div><button class="btn" data-a="topicquiz">${t("topicQuiz")}</button><button class="btn ghost" data-a="open" data-v="${x.l}">${T[S.lang].goLesson(x.l)}</button>`;
  return h;
}
function quizHTML(q){
  const Q=q.qs[q.i], n=q.qs.length;
  let h=`<div class="qprog"><div class="bar"><i style="width:${Math.round(q.i/n*100)}%"></i></div><span>${q.i+1}/${n}</span></div>`;
  const answered=Q.res!==null;
  if(Q.k!=="order"){
    const label={mean:t("qMean"),rev:t("qRev"),listen:t("qListen")}[Q.k];
    h+=`<div class="qlabel">${label}</div><div class="qcard">`;
    if(Q.k==="mean") h+=`<div class="zh" lang="zh">${Q.w[0]}</div><div class="py">${esc(Q.w[1])}</div><button class="spk sm" data-a="say" data-v="${esc(Q.w[0])}" aria-label="ฟัง">${IC.spk}</button>`;
    if(Q.k==="rev") h+=`<div class="mean">${esc(mean(Q.w))}</div>`;
    if(Q.k==="listen") h+=`<button class="spk" data-a="say" data-v="${esc(Q.w[0])}" aria-label="${t("listenAgain")}">${IC.spk}</button><div class="note">${t("listenAgain")}</div>`;
    h+=`</div><div class="opts">`;
    Q.opts.forEach((o,i)=>{
      const isAns=o[0]===Q.w[0]; let cls=""; if(answered){ if(isAns) cls="ok"; else if(i===Q.pick) cls="no"; }
      const txt=Q.k==="mean"? esc(mean(o)) : o[0];
      h+=`<button class="opt ${Q.k!=="mean"?"zhf":""} ${cls}" data-a="opt" data-v="${i}" ${answered?"disabled":""}>${txt}${answered&&isAns?IC.check:""}</button>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div class="qlabel">${t("qOrder")}</div><div class="qcard"><div class="mean" style="font-size:20px">${esc(tx(Q.th))}</div></div>`;
    h+=`<div class="ansline" aria-label="คำตอบ">${Q.built.map((j,pos)=>`<button class="tok" data-a="untok" data-v="${pos}" ${answered?"disabled":""}>${Q.bank[j]}</button>`).join("")}</div>`;
    h+=`<div class="chips" style="gap:8px">${Q.bank.map((tk,j)=>Q.built.includes(j)?"":`<button class="tok" data-a="tok" data-v="${j}" ${answered?"disabled":""}>${tk}</button>`).join("")}</div>`;
    if(!answered) h+=`<button class="btn" data-a="check" ${Q.built.length<Q.bank.length?"disabled":""}>${t("check")}</button>`;
  }
  if(answered){
    const last=q.i===n-1;
    const ansTxt=Q.k==="order"? `${Q.s.join("")} · <span class="py">${esc(Q.py)}</span>` : `${Q.w[0]} · <span class="py">${esc(Q.w[1])}</span> · ${esc(mean(Q.w))}`;
    h+=`<div class="fb ${Q.res?"good":"bad"}" role="status"><b>${Q.res?t("good"):t("bad")}</b><div style="font-family:var(--f-ui);font-size:17px">${ansTxt}</div><button class="btn" data-a="qnext">${last?t("seeResult"):t("next")}</button></div>`;
  }
  return h;
}
function resultHTML(q,isLesson){
  const n=q.qs.length;
  let h=`<div class="card result"><div class="note">${t("result")}</div><div class="score">${q.correct}/${n}</div><div style="font-weight:700;color:var(--amber-ink)">${T[S.lang].gotPts(q.correct*10)}</div></div>`;
  if(isLesson){
    if(view.li<L.length-1) h+=`<button class="btn" data-a="open" data-v="${view.li+1}">${t("nextLesson")}</button>`;
    h+=`<button class="btn ghost" data-a="exit">${t("finish")}</button>`;
  } else {
    h+=`<button class="btn" data-a="retryq">${t("retry")}</button><button class="btn ghost" data-a="exit">${t("back")}</button>`;
  }
  return h;
}

/* ---------- การกดปุ่ม ---------- */
function curQuiz(){return view&&view.quiz}
const A={
  tab:v=>{tab=v; resetArmed=false; render(true)},
  lang:v=>{S.lang=v; save(); render()},
  open:v=>openLesson(+v),
  exit:()=>{try{speechSynthesis.cancel()}catch(e){} view=null; render(true)},
  step:v=>{view.step=+v; view.vi=0; render(true)},
  vprev:()=>{view.vi=Math.max(0,view.vi-1); render(); speak(L[view.li].v[view.vi][0])},
  vnext:()=>{view.vi=Math.min(L[view.li].v.length-1,view.vi+1); render(); speak(L[view.li].v[view.vi][0])},
  vjump:v=>{view.vi=+v; render(); speak(L[view.li].v[view.vi][0])},
  say:v=>speak(v),
  sayall:()=>{try{speechSynthesis.cancel()}catch(e){} L[view.li].d.forEach(d=>speak(d[1],true))},
  said:v=>{view.said[v]=!view.said[v]; render()},
  mic:v=>{if(!SR)return; const i=+v; view.mic=view.mic||{};
    if(view.mic[i]&&view.mic[i].st==="listen"){stopMic(); delete view.mic[i]; render(); return}
    stopMic(); try{speechSynthesis.cancel()}catch(e){}
    const target=L[view.li].s[i][0].split("|").join("");
    Object.keys(view.mic).forEach(k=>{if(view.mic[k].st==="listen")delete view.mic[k]});
    view.mic[i]={st:"listen"}; render();
    const r=new SR(); recog=r; r.lang="zh-CN"; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
    r.onresult=e=>{const alts=[...e.results[0]].map(a=>(a&&a.transcript)||""); let best=null; alts.forEach(tr=>{const sc=micScore(target,tr); if(!best||sc.p>best.p) best={...sc,heard:tr}}); view.mic[i]={st:"done",...best}; if(best.p>=80) view.said[i]=true; if(view.type==="lesson") render()};
    r.onerror=e=>{if(e.error==="aborted")return; view.mic[i]={st:"err",err:e.error}; if(view.type==="lesson") render()};
    r.onend=()=>{if(recog===r) recog=null; if(view.mic[i]&&view.mic[i].st==="listen"){view.mic[i]={st:"err",err:"no-speech"}; if(view.type==="lesson") render()}};
    try{r.start()}catch(e){view.mic[i]={st:"err",err:"start"}; render()}},
  topic:v=>{const l=TOPICS[+v].l; view=unlocked(l)?{type:"topic",ti:+v}:{type:"locked",li:l}; render(true)},
  join:()=>{view=null; tab="me"; render(true); setTimeout(()=>{const el=document.getElementById("member"); if(el) el.scrollIntoView({block:"start"})},30)},
  copybk:()=>{const txt=makeBackup(); try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")+": "+txt),()=>selectEl("bk"))}catch(e){selectEl("bk")}},
  restore:()=>{const inp=document.getElementById("restoreInput"), msg=document.getElementById("restoreMsg"), btn=document.getElementById("restoreBtn"); const r=readBackup(inp.value);
    if(!r){msg.textContent=t("restoreBad"); msg.style.color="var(--bad)"; restoreArmed=null; btn.textContent=t("restoreBtn"); return}
    if(restoreArmed!==inp.value){restoreArmed=inp.value; btn.textContent=t("restoreSure"); msg.textContent=""; return}
    restoreArmed=null; S.done=r.done; S.pts=r.pts; S.streak=r.streak; S.last=r.last; save(); render(); toast(T[S.lang].restoreOk(Object.keys(r.done).length,r.pts))},
  activate:async()=>{const inp=document.getElementById("codeInput"), uin=document.getElementById("userInput"), msg=document.getElementById("codeMsg"); const ex=await readCode(inp.value,uin.value);
    if(ex===null){msg.textContent=t("codeBad"); msg.style.color="var(--bad)"; return}
    if(ex<effToday()){msg.textContent=T[S.lang].codeOld(fmtDay(ex)); msg.style.color="var(--bad)"; return}
    S.code=norm(inp.value); S.user=normU(uin.value); memberExp=ex; save(); render(); const m=document.getElementById("codeMsg"); if(m){m.textContent=T[S.lang].codeOk(fmtDay(ex)); m.style.color="var(--brand)"}},
  topicquiz:()=>{const ti=view.ti; const ws=topicWords(ti); const pool=ws.length>=4?ws:L[TOPICS[ti].l].v; view={type:"quiz",title:lname(TOPICS[ti]),quiz:mkQuiz(pool,[],Math.min(8,Math.max(5,pool.length))),src:{k:"topic",ti}}; render(true)},
  practice:()=>{const p=learnedPool(); const pool=p.length>=4?p:ALLV; const says=[].concat(...(p.length>=4?Object.keys(S.done).map(Number).filter(i=>i>0):[1,2]).map(i=>L[i].s)); view={type:"quiz",title:t("pracTitle"),quiz:mkQuiz(pool,says,10),src:{k:"practice"}}; render(true)},
  retryq:()=>{const s=view.src; if(s.k==="topic"){view={type:"topic",ti:s.ti}; A.topicquiz()} else A.practice()},
  opt:v=>{const q=curQuiz(), Q=q.qs[q.i]; if(Q.res!==null) return; Q.pick=+v; Q.res=Q.opts[+v][0]===Q.w[0]; grade(q,Q); render(); if(Q.res) speak(Q.w[0])},
  tok:v=>{const Q=curQuiz().qs[curQuiz().i]; if(Q.res===null&&!Q.built.includes(+v)){Q.built.push(+v); speak(Q.bank[+v]); render()}},
  untok:v=>{const Q=curQuiz().qs[curQuiz().i]; if(Q.res===null){Q.built.splice(+v,1); render()}},
  check:()=>{const q=curQuiz(), Q=q.qs[q.i]; Q.res=Q.built.map(j=>Q.bank[j]).join("")===Q.s.join(""); grade(q,Q); render(); speak(Q.s.join(""))},
  qnext:()=>{const q=curQuiz(); if(q.i<q.qs.length-1){q.i++; render(true); const Q=q.qs[q.i]; if(Q.k==="listen") setTimeout(()=>speak(Q.w[0]),150)} else { q.fin=true; if(view.type==="lesson"){view.fin=true; S.done[view.li]=true; touch(); save();} render(true)}},
  reset:()=>{if(!resetArmed){resetArmed=true; render(); return} const {lang,user,code,maxDay,trial}=S; S={pts:0,streak:0,last:"",done:{},lang,user,code,maxDay,trial}; save(); resetArmed=false; render(); toast(t("resetDone"))}
};
function grade(q,Q){if(Q.res){q.correct++; S.pts+=10; touch(); save();}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]"); if(!b||b.disabled) return; const f=A[b.dataset.a]; if(f) f(b.dataset.v,b);});
/* เปิดคำถามฟังเสียงครั้งแรกเมื่อเข้าแบบฝึกหัด */
const _step=A.step; A.step=v=>{_step(v); const q=curQuiz(); if(view&&stepsOf(view.li)[view.step]==="quiz"&&q&&q.qs[q.i].k==="listen"&&q.qs[q.i].res===null) setTimeout(()=>speak(q.qs[q.i].w[0]),150)};
let restoreArmed=null;
function selectEl(id){const el=document.getElementById(id); if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);}
render();
if(S.code&&S.user) readCode(S.code,S.user).then(ex=>{memberExp=ex; if(!view||view.type==="locked") render();});

</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
